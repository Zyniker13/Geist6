name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-package:
    name: Package (Linux, swift test)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: swift-actions/setup-swift@6893b0f37d49a84aad90a648a286cd66d332934d # v2.4.0
        with:
          swift-version: "6.2"
      - name: Install stripe-mock
        run: |
          curl -fsSL -o /tmp/stripe-mock.tar.gz \
            https://github.com/stripe/stripe-mock/releases/download/v0.206.0/stripe-mock_0.206.0_linux_amd64.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/stripe-mock.tar.gz -C "$HOME/.local/bin" stripe-mock || tar -xzf /tmp/stripe-mock.tar.gz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/stripe-mock"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          stripe-mock -version
      - name: Check
        run: ./scripts/check.sh

  macos-package:
    name: Package and app (macOS, Xcode)
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Select latest Xcode
        # The package manifest needs Swift 6.2+ toolchain; use whatever
        # Xcode version the runner ships (macos-latest defaults to latest).
        run: |
          set -eu
          # Prefer Xcode_2*.app naming; fall back to Xcode.app
          XCODE_PATH=$(ls -d /Applications/Xcode_2*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          echo "Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          swift --version
      - name: Install tools
        run: |
          brew install stripe/stripe-mock/stripe-mock xcodegen swiftlint swift-format
      - name: Check
        run: ./scripts/check.sh
