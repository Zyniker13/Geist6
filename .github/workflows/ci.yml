name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos-package:
    # The Linux job was removed (decision 0008): GitHub's ubuntu runners
    # failed at "Set up job" on four consecutive runs across ubuntu-latest
    # and ubuntu-24.04, making every push red and masking real failures.
    # The macOS job runs the full check.sh gate for the iPad-only product.
    name: Package and app (macOS, Xcode)
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Select latest Xcode
        # The package manifest needs Swift 6.2+ toolchain; use whatever
        # Xcode version the runner ships (macos-latest defaults to latest).
        run: |
          set -eu
          # Prefer Xcode_2*.app naming; fall back to Xcode.app
          XCODE_PATH=$(ls -d /Applications/Xcode_2*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          echo "Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          swift --version
      - name: Install tools
        run: |
          brew install stripe/stripe-mock/stripe-mock xcodegen swiftlint swift-format
      - name: Check
        run: |
          set -eu
          if ./scripts/check.sh 2>&1 | tee /tmp/check-output.txt; then
            echo "check.sh passed"
          else
            echo "check.sh failed" >&2
            cat /tmp/check-output.txt >&2
            exit 1
          fi
